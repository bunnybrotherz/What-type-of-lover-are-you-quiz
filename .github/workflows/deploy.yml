name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Setup Node.js (match local version)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20        # match your local Node version
          cache: 'npm'            # automatically caches ~/.npm

      # 3. Install dependencies cleanly
      - name: Install dependencies
        run: npm ci

      # 4. Run tests (adjust to your test command)
      - name: Run tests
        run: npm test

      # 5. Build (if applicable)
      - name: Build
        run: npm run build
